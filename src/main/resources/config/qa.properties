# Ambiente por defecto: API pública de Restful-Booker.
booker.base-uri=https://restful-booker.herokuapp.com

# Credenciales de demostración que publica la documentación de la API.
# Cualquier valor se puede sobrescribir con una variable de entorno
# (BOOKER_USERNAME, BOOKER_PASSWORD, BOOKER_BASE_URI...) o con -Dbooker.<clave>=<valor>.
booker.username=admin
booker.password=password123

# Umbral de precio del escenario 3 (análisis de valores límite: umbral - 1, umbral, umbral + 1).
booker.price-threshold=500
# SLA de tiempo de respuesta del escenario 4.
booker.sla-millis=2000
# ID que no existe en la API, para los casos negativos.
booker.nonexistent-booking-id=9999999
