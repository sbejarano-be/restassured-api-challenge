# Contenedor Docker oficial de Restful-Booker:
#   docker run -d -p 3001:3001 mwinteringham/restfulbooker
booker.base-uri=http://localhost:3001

# El contenedor trae las mismas credenciales de demostración que la API pública.
booker.username=admin
booker.password=password123

booker.price-threshold=500
booker.sla-millis=2000
booker.nonexistent-booking-id=9999999
